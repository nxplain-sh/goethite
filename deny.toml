# cargo-deny: https://embarkstudios.github.io/cargo-deny/
#
# `cargo deny check` runs in CI. Every new dependency must pass it and be
# justified in the pull request description (AGENTS.md, "Security rules").

[graph]
# Platforms goethite runs on (Linux) and is developed on (macOS).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
# Vulnerable, unsound, unmaintained and yanked crates all fail the check.
# An ignored advisory needs a comment with the reason and when to revisit it.
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with shipping goethite under MIT OR Apache-2.0.
# Unicode-3.0 covers the ICU crates behind IDNA name handling; ISC and
# BSD-3-Clause come with the TLS stack (ring, rustls-webpki, untrusted, subtle).
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93

# webpki-roots is the Mozilla root certificate data, under a permissive data
# license.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# libfuzzer-sys bundles LLVM's libFuzzer (NCSA). It is only used by the fuzz
# targets in fuzz/, which CI checks with --manifest-path, and never ships.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies (publish = false) are not wildcards.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
