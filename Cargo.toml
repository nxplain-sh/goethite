[workspace]
resolver = "3"
# Listed one by one rather than globbed, so adding a crate is a visible change.
members = [
    "crates/goethite",
    "crates/goethite-api",
    "crates/goethite-cluster",
    "crates/goethite-filter",
    "crates/goethite-migrate",
    "crates/goethite-proto",
    "crates/goethite-resolver",
    "crates/goethite-server",
    "crates/goethite-store",
    "crates/goethite-tui",
    "xtask",
]
# What `cargo run`, `cargo build` and `cargo test` mean without -p or
# --workspace: goethite, not the automation. With xtask as a second binary,
# a bare `cargo run` would otherwise not know which one to start.
default-members = ["crates/*"]
# cargo-fuzz targets need nightly and libFuzzer; they live in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nxplain-sh/goethite"
homepage = "https://nxplain-sh.github.io/goethite/"
authors = ["goethite contributors"]
publish = false

[workspace.dependencies]
# Internal crates, with `path` for local builds and `version` for what a manifest
# records. Bump these with `workspace.package.version`.
goethite-api = { path = "crates/goethite-api", version = "0.4.0" }
goethite-cluster = { path = "crates/goethite-cluster", version = "0.4.0" }
goethite-filter = { path = "crates/goethite-filter", version = "0.4.0" }
goethite-migrate = { path = "crates/goethite-migrate", version = "0.4.0" }
goethite-proto = { path = "crates/goethite-proto", version = "0.4.0" }
goethite-resolver = { path = "crates/goethite-resolver", version = "0.4.0" }
goethite-server = { path = "crates/goethite-server", version = "0.4.0" }
goethite-store = { path = "crates/goethite-store", version = "0.4.0" }
goethite-tui = { path = "crates/goethite-tui", version = "0.4.0" }

# External crates. Every addition must pass `cargo deny check` and be justified in the PR.
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "matched-path", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
fst = { version = "0.4.7", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std", "dnssec-ring"] }
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "aes", "x25519"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
jiff = { version = "0.2.38", features = ["serde"] }
# The sandbox (ADR 0032), Linux only: Landlock for files, seccomp for system calls.
landlock = "0.4.7"
# Raft for the cluster's configuration (ADR 0031). 0.9 is the stable line; storage-v2
# lets goethite keep the log and the state machine in its own store.
openraft = { version = "=0.9.25", default-features = false, features = ["serde", "storage-v2"] }
proptest = "1.11.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
rand = { version = "0.10.3", default-features = false, features = ["std", "thread_rng"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
redb = "4.3.0"
ring = { version = "0.17.14", default-features = false }
rust-embed = { version = "8.13.0", default-features = false, features = ["deterministic-timestamps"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "thread", "net"] }
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "smallvec", "env-filter"] }
utoipa = { version = "6.0.0", features = ["jiff_0_2"] }
webpki-roots = "1.0.9"

[workspace.lints.rust]
# Security rule: no unsafe code, except where AGENTS.md allows it with a
# written justification: the binary (adopting sockets systemd passes by
# number) and goethite-cluster (the link-layer address of a gratuitous ARP),
# each in one function with `#[allow(unsafe_code)]` and a SAFETY comment.
# Every other crate carries `#![forbid(unsafe_code)]` in its root, which no
# allow can override.
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
# `pub` that no other crate can reach says less than `pub(crate)` would.
unreachable_pub = "warn"
# Public types implement Debug; one holding a secret prints it redacted.
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"

# Security rule: never panic on data from the wire, config or API. Denied in all
# non-test code (clippy.toml allows them inside tests).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

# Log with `tracing`, never print.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Profiles are only read from the workspace root.
[profile.release]
# Thin LTO and one codegen unit trade build time for code generated across
# crate boundaries; see bench/README.md for what it measured. Unwinding stays
# on (a panicking task fails alone instead of taking the listeners down) and
# symbols stay in (backtraces in the journal name their functions).
lto = "thin"
codegen-units = 1

# Benches inherit `release`; debug info lets a profiler attribute samples to lines.
[profile.bench]
debug = true
