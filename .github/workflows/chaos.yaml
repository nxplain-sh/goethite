name: Chaos

# Two nodes and a client in network namespaces: upgrades, crashes, a
# partition and a corrupt list while the client queries the floating IP.
# See tests/chaos/README.md.
on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  chaos:
    name: chaos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release --locked -p goethite
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bind9-dnsutils dnsperf nftables
      - name: Run the scenarios
        run: sudo tests/chaos/chaos.sh target/release/goethite
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-logs
          path: |
            /tmp/goethite-chaos/*/*.log
            /tmp/goethite-chaos/*.dnsperf
          if-no-files-found: ignore
          retention-days: 7
