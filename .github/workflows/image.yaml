name: Image

# Pushes the container image to ghcr.io when a release is published. The
# image is built by `cargo xtask image` from the release's own tarballs, once
# they match SHA256SUMS and their provenance attestations, so it holds exactly
# the released binaries. The image is then attested (Sigstore, keyless) and
# the attestation stored in the registry beside it. See ADR 0027.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to push the image for, such as v0.5.0
        required: true

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  push:
    name: push the image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # a Sigstore signing certificate for this workflow
      attestations: write # store the attestation with the repository
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Download and check the release's tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/dist
          cd target/dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'goethite-*-unknown-linux-gnu.tar.gz' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          for tarball in goethite-*-unknown-linux-gnu.tar.gz; do
            gh attestation verify "$tarball" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
          done
          rm SHA256SUMS
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # A release gets its version, its minor version and latest; a
      # pre-release (v0.5.0-rc.1) only its own.
      - name: Build and push the image
        run: |
          docker buildx create --use > /dev/null
          version=${TAG#v}
          if [ "$version" = "${version%-*}" ]; then
            cargo xtask image --push "$IMAGE:$version" "$IMAGE:${version%.*}" "$IMAGE:latest"
          else
            cargo xtask image --push "$IMAGE:$version"
          fi
          echo "DIGEST=$(jq -r '."containerimage.digest"' target/dist/image-metadata.json)" >> "$GITHUB_ENV"
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
