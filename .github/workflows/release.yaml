name: Release

# Builds the release files for amd64 and arm64 twice, on separate runners,
# and fails unless both builds of an architecture are the same bytes. On a
# `v*` tag it then attests the files (Sigstore, keyless: no key to keep) and
# drafts a GitHub Release, which a maintainer reviews and publishes. Weekly,
# and on changes to the build, it runs as a reproducibility check only.
#
# Builds run in the pinned image from xtask/dist/Containerfile, exactly as
# `cargo xtask dist` runs them locally, with no cache: a release never
# depends on the state of a previous run. See docs/adr/0026-release-builds.md.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - xtask/**
      - web/.node-version
      - .github/workflows/release.yaml
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.arch }}, ${{ matrix.round }})
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        round: [first, second]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only xtask itself builds on the runner; goethite builds in the image.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the release files
        run: cargo xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}-${{ matrix.round }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  reproducible:
    name: reproducible
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
      - name: Compare the two builds of each architecture
        run: |
          status=0
          for arch in amd64 arm64; do
            (cd "dist/dist-$arch-first" && sha256sum -- *) > "first-$arch.txt"
            (cd "dist/dist-$arch-second" && sha256sum -- *) > "second-$arch.txt"
            cat "first-$arch.txt"
            if ! diff -u "first-$arch.txt" "second-$arch.txt"; then
              echo "::error::the two $arch builds differ: compare them with diffoscope"
              status=1
            fi
          done
          # The release takes the web UI's SBOM from one architecture.
          if ! cmp dist/dist-amd64-first/goethite-*-web.cdx.json dist/dist-arm64-first/goethite-*-web.cdx.json; then
            echo "::error::the web UI's SBOM differs between the architectures"
            status=1
          fi
          exit "$status"

  release:
    name: draft the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: reproducible
    runs-on: ubuntu-24.04
    permissions:
      contents: write # draft the GitHub Release
      id-token: write # a Sigstore signing certificate for this workflow
      attestations: write # store the attestations with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v${version:?}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          # Releases come from main, which only takes reviewed merges from development.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-first
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest the build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest the amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/goethite-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          sbom-path: dist/goethite-${{ env.VERSION }}-x86_64-unknown-linux-gnu.cdx.json
      - name: Attest the arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/goethite-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz
          sbom-path: dist/goethite-${{ env.VERSION }}-aarch64-unknown-linux-gnu.cdx.json
      - name: Attest the web UI SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/goethite-${{ env.VERSION }}-web.cdx.json
      # With the bundle, `gh attestation verify --bundle` needs no GitHub API.
      - name: Keep the provenance bundle with the files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/goethite-$VERSION.provenance.sigstore.json"
      - name: Take the release notes from the changelog
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "goethite $VERSION" --notes-file notes.md dist/*
