name: Fuzz targets

# Builds every fuzz target with the nightly pinned in fuzz/rust-toolchain.toml,
# so the targets keep compiling as the parsers change. Fuzzing itself never
# runs in this public repository: a crash it found would be public, in the
# log and the artifacts, before its fix. Maintainers fuzz with
# `cargo xtask fuzz` before every release (docs/adr/0028-fuzzing-off-public-ci.md).

on:
  push:
    branches: [main, development]
  pull_request:
    paths:
      - fuzz/**
      - crates/**
      - Cargo.lock
      - .github/workflows/fuzz.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fuzz targets build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' fuzz/rust-toolchain.toml)
          rustup toolchain install "${channel:?}" --profile minimal
          echo "FUZZ_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Build every target
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz build
