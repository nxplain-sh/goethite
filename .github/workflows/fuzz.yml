name: Fuzz

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to run each target (1 to 3600)
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # Fuzzing is capped at 3600 s; this leaves room for building the tools.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Every target in fuzz/fuzz_targets/ goes here.
        target: [classify_response, decode_query, decode_query_record, decode_response, parse_cidr, parse_doh, parse_doq, parse_filterlists, parse_list, parse_name, parse_odoh, parse_services, parse_netlink, parse_vrrp, request_checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          # libFuzzer treats 0 as "no limit", so require 1 to 3600.
          if ! [[ "$SECONDS_PER_TARGET" =~ ^[1-9][0-9]{0,3}$ ]] || (( SECONDS_PER_TARGET > 3600 )); then
            echo "::error::seconds must be between 1 and 3600"
            exit 1
          fi
          mkdir -p "fuzz/corpus/$TARGET"
          cargo +nightly fuzz run "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET"
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          # The repository is public: keep crash inputs only as long as needed
          # to reproduce them (see SECURITY.md).
          retention-days: 7
