name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so new advisories against unchanged dependencies are noticed.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked
      # Switching users needs root; the regular run skips this test.
      - name: Test dropping privileges as root
        run: |
          bin=$(cargo test --workspace --all-features --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cli" and .profile.test) | .executable')
          sudo GOETHITE_ROOT_TESTS=1 "${bin:?}" --exact serving::switches_to_the_configured_user_when_root \
            2>&1 | tee "$RUNNER_TEMP/root-tests.txt"
          sudo chown -R "$(id -u):$(id -g)" target
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/root-tests.txt"
      - name: Check the systemd unit
        run: |
          sed "s|/usr/bin/goethite|$PWD/target/debug/goethite|" dist/systemd/goethite.service \
            > "$RUNNER_TEMP/goethite.service"
          systemd-analyze verify "$RUNNER_TEMP/goethite.service"

  # Breaking changes to /api/v1 fail a pull request unless it carries the
  # `api-breaking` label. The committed openapi.json is checked against the
  # code by the test job; this compares it with the base branch's.
  api-compat:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get the base branch's OpenAPI document
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:crates/goethite-api/openapi.json" > "$RUNNER_TEMP/base.json"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base branch has no OpenAPI document yet; nothing to compare."
          fi
      - name: Check for breaking changes
        if: steps.base.outputs.found == 'true' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: ${{ runner.temp }}/base.json
          revision: crates/goethite-api/openapi.json
          fail-on: ERR

  web:
    name: web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Check the API client matches the OpenAPI document
        working-directory: web
        run: |
          npm run api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is out of date: run 'npm run api' in web/ and commit it"
            exit 1
          fi
      - name: Type-check, build and check the size budget
        working-directory: web
        run: npm run build
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Embed the UI in a release build and serve it
        run: |
          cargo build --release --locked -p goethite
          ./target/release/goethite run --config config/goethite.example.toml &
          server=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8053/api/v1/health > /dev/null && break
            sleep 1
          done
          page=$(curl -sf http://127.0.0.1:8053/querylog)
          grep -q '<div id="root">' <<< "$page"
          script=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' <<< "$page")
          curl -sf -o /dev/null "http://127.0.0.1:8053${script}"
          kill "$server"
      - name: Install Chromium for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the release build
        working-directory: web
        env:
          GOETHITE_BIN: ${{ github.workspace }}/target/release/goethite
        run: npm run e2e
      - name: Upload the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that rust-toolchain.toml pins the MSRV
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          echo "rust-version: ${msrv:?}, rust-toolchain.toml: ${pinned:?}"
          case "$pinned" in
            "$msrv" | "$msrv".*) ;;
            *) echo "::error::rust-toolchain.toml ($pinned) does not match rust-version ($msrv)"; exit 1 ;;
          esac
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - name: Install the MSRV toolchain
        run: rustup toolchain install "$MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +"$MSRV" check --workspace --all-targets --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check advisories bans licenses sources
      - name: cargo deny (fuzz workspace)
        run: cargo deny --manifest-path fuzz/Cargo.toml check advisories bans licenses sources

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit --deny warnings
      - name: cargo audit (fuzz workspace)
        run: cargo audit --deny warnings --file fuzz/Cargo.lock
