name: CI

# No `push` trigger. Changes reach development and main through pull
# requests (docs/branching.md), and a pull request's run already tests the
# merge result (refs/pull/N/merge), so a run on the push that merges it would
# test the same tree a second time.
on:
  # Documentation and the website cannot break the build, so a pull request
  # that only changes them starts nothing. A pull request into main always
  # runs: it is a release, which bumps the version in Cargo.toml. One that
  # does not is no release, and its required checks stay pending.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "site/**"
  # Weekly, so new advisories against unchanged dependencies are noticed. It
  # runs on main, and every branch can restore main's caches.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # main holds the latest release: it takes a release from development or a
  # hotfix/ branch, with a new version and nothing left under [Unreleased].
  # Other branches of this repository are named <kind>/<what>. See
  # docs/branching.md. A required check, since a ruleset cannot restrict a
  # pull request's source.
  source-branch:
    name: source branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check the branch names
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE_REF" = main ]; then
            case "$HEAD_REPO:$HEAD_REF" in
              "$REPO:development" | "$REPO:hotfix/"?*) ;;
              *)
                echo "::error::Pull requests into main come from development or a hotfix/ branch (docs/branching.md). Retarget this one to development."
                exit 1
                ;;
            esac
          elif [ "$HEAD_REPO" = "$REPO" ]; then
            case "$HEAD_REF" in
              feature/?* | fix/?* | refactor/?* | chore/?* | docs/?* | renovate/?*) ;;
              *)
                echo "::error::Branches are named <kind>/<what>, with feature/, fix/, refactor/, chore/ or docs/ (docs/branching.md). Rename this one (git branch -m), push it and open the pull request again."
                exit 1
                ;;
            esac
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.base_ref == 'main'
        with:
          persist-credentials: false
      - name: Only releases merge into main
        if: github.base_ref == 'main'
        run: |
          unreleased=$(awk '/^## \[Unreleased\]/ { on = 1; next } /^## / { on = 0 } on && NF' CHANGELOG.md)
          if [ -n "$unreleased" ]; then
            echo "::error::CHANGELOG.md has entries under [Unreleased]. main takes releases only: prepare the release first (docs/releases.md)."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          released=$(git show FETCH_HEAD:Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          proposed=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "${proposed:?}" = "${released:?}" ]; then
            echo "::error::The version is still $released, main's. main takes releases only: prepare the release first (docs/releases.md)."
            exit 1
          fi

  # A release bumps the version in several files; `cargo xtask versions`
  # checks that they agree.
  versions:
    name: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo xtask versions

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Broken intra-doc links and malformed doc comments fail the build. Doctests
  # run in the test job: `cargo test` without --all-targets includes them.
  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # shellcheck ships with GitHub's Ubuntu images; nothing to install.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  test:
    name: test (linux ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked
      # Switching users needs root; the regular run skips this test.
      - name: Test dropping privileges as root
        run: |
          bin=$(cargo test --workspace --all-features --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "cli" and .profile.test) | .executable')
          sudo GOETHITE_ROOT_TESTS=1 "${bin:?}" --exact serving::switches_to_the_configured_user_when_root \
            2>&1 | tee "$RUNNER_TEMP/root-tests.txt"
          sudo chown -R "$(id -u):$(id -g)" target
          grep -q "test result: ok. 1 passed" "$RUNNER_TEMP/root-tests.txt"
      - name: Check the systemd units
        run: |
          for unit in goethite goethite-witness; do
            sed "s|/usr/bin/goethite|$PWD/target/debug/goethite|" "deploy/systemd/$unit.service" \
              > "$RUNNER_TEMP/$unit.service"
            systemd-analyze verify "$RUNNER_TEMP/$unit.service"
          done

  # Helm ships with the runner image. A template error would keep users from
  # installing the chart; lint it, and render both shapes, unprivileged and on
  # the host's network, and one with a user's config.
  helm:
    name: helm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: helm lint deploy/helm/goethite
      - run: helm template goethite deploy/helm/goethite > /dev/null
      - run: helm template goethite deploy/helm/goethite --set-file config=deploy/container/goethite.toml > /dev/null
      - run: helm template goethite deploy/helm/goethite --set hostNetwork=true --set persistence.enabled=false > /dev/null

  # Breaking changes to /api/v1 fail a pull request unless it carries the
  # `api-breaking` label. The committed openapi.json is checked against the
  # code by the test job; this compares it with the base branch's.
  api-compat:
    name: API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Into the workspace: the oasdiff action runs in a container that sees
      # the workspace, but not the runner's temporary directory.
      - name: Get the base branch's OpenAPI document
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:crates/goethite-api/openapi.json" > base-openapi.json; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base branch has no OpenAPI document yet; nothing to compare."
          fi
      - name: Check for breaking changes
        if: steps.base.outputs.found == 'true' && !contains(github.event.pull_request.labels.*.name, 'api-breaking')
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: base-openapi.json
          revision: crates/goethite-api/openapi.json
          fail-on: ERR

  web:
    name: web UI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Check the API client matches the OpenAPI document
        working-directory: web
        run: |
          npm run api
          if ! git diff --exit-code -- src/api/schema.d.ts; then
            echo "::error::web/src/api/schema.d.ts is out of date: run 'npm run api' in web/ and commit it"
            exit 1
          fi
      - name: Format, lint and type-check (vp check)
        working-directory: web
        run: npm run check
      - name: Build and check the size budget
        working-directory: web
        run: npm run build
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Embed the UI in a release build and serve it
        run: |
          cargo build --release --locked -p goethite
          ./target/release/goethite run --config config/goethite.example.toml &
          server=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8053/api/v1/health > /dev/null && break
            sleep 1
          done
          page=$(curl -sf http://127.0.0.1:8053/querylog)
          grep -q '<div id="root">' <<< "$page"
          script=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' <<< "$page")
          curl -sf -o /dev/null "http://127.0.0.1:8053${script}"
          kill "$server"
      - name: Install Chromium for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the release build
        working-directory: web
        env:
          GOETHITE_BIN: ${{ github.workspace }}/target/release/goethite
        run: npm run e2e
      - name: Upload the end-to-end traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The pinned toolchain is the MSRV (ADR 0025), so clippy already builds
  # every target with it. This only checks that the two still agree.
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that rust-toolchain.toml pins the MSRV
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          echo "rust-version: ${msrv:?}, rust-toolchain.toml: ${pinned:?}"
          case "$pinned" in
            "$msrv" | "$msrv".*) ;;
            *) echo "::error::rust-toolchain.toml ($pinned) does not match rust-version ($msrv)"; exit 1 ;;
          esac

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny check advisories bans licenses sources
      - name: cargo deny (fuzz workspace)
        run: cargo deny --manifest-path fuzz/Cargo.toml check advisories bans licenses sources

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - run: cargo audit --deny warnings
      - name: cargo audit (fuzz workspace)
        run: cargo audit --deny warnings --file fuzz/Cargo.lock
