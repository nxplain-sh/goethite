[package]
name = "goethite-cluster"
description = "Cluster support for goethite: replicated config, VRRP floating IP and (later) Raft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
goethite-store.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tokio-rustls.workspace = true
tracing.workspace = true

# The floating IP: raw sockets, netlink and packet sockets.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true
socket2.workspace = true

[dev-dependencies]
goethite-api.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
