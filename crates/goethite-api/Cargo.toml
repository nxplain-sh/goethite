[package]
name = "goethite-api"
description = "REST API (/api/v1) for goethite, with an OpenAPI description."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
axum.workspace = true
goethite-proto.workspace = true
goethite-resolver.workspace = true
goethite-store.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "service", "tokio"] }
jiff.workspace = true
rand.workspace = true
ring.workspace = true
rust-embed.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tower.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
