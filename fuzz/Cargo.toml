[package]
name = "goethite-fuzz"
description = "cargo-fuzz targets for goethite. Every parser gets one."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
goethite-api = { path = "../crates/goethite-api" }
goethite-filter = { path = "../crates/goethite-filter" }
goethite-proto = { path = "../crates/goethite-proto" }
goethite-resolver = { path = "../crates/goethite-resolver" }
goethite-store = { path = "../crates/goethite-store" }
libfuzzer-sys = "0.4.13"

# Fuzz targets need nightly and libFuzzer, so they are their own workspace
# (the root workspace excludes this directory).
[workspace]
members = ["."]

[[bin]]
name = "decode_query"
path = "fuzz_targets/decode_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_query_record"
path = "fuzz_targets/decode_query_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_response"
path = "fuzz_targets/decode_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_cidr"
path = "fuzz_targets/parse_cidr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_list"
path = "fuzz_targets/parse_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_name"
path = "fuzz_targets/parse_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request_checks"
path = "fuzz_targets/request_checks.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
