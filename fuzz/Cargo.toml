[package]
name = "goethite-fuzz"
description = "cargo-fuzz targets for goethite. Every parser gets one."
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
goethite-api = { path = "../crates/goethite-api" }
goethite-cluster = { path = "../crates/goethite-cluster" }
goethite-filter = { path = "../crates/goethite-filter" }
goethite-migrate = { path = "../crates/goethite-migrate" }
goethite-proto = { path = "../crates/goethite-proto" }
goethite-resolver = { path = "../crates/goethite-resolver" }
goethite-server = { path = "../crates/goethite-server" }
goethite-store = { path = "../crates/goethite-store" }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"

# Fuzz targets need nightly and libFuzzer, so they are their own workspace
# (the root workspace excludes this directory).
[workspace]
members = ["."]

[[bin]]
name = "apply-commands"
path = "fuzz_targets/apply-commands.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify-response"
path = "fuzz_targets/classify-response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check-dnssec"
path = "fuzz_targets/check-dnssec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode-query"
path = "fuzz_targets/decode-query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode-query-record"
path = "fuzz_targets/decode-query-record.rs"
