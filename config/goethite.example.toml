# goethite configuration (example)
#
# Run with:  goethite run --config config/goethite.example.toml
#
# This file only bootstraps a node. Unknown keys are rejected, so a typo is an
# error rather than a silently ignored setting.

[server]
# Addresses for DNS over UDP and TCP: one, or a list. Port 15353 on loopback
# lets development builds run without root (5353 is avoided: it is multicast
# DNS and usually taken). Production uses port 53, for example
#   listen = ["0.0.0.0:53", "[::]:53"]
# IPv6 addresses only accept IPv6, so list both families to serve both. Use IP
# addresses here, not hostnames. This is the default.
listen = "127.0.0.1:15353"

# On Linux each listen address gets several UDP sockets (SO_REUSEPORT), one per
# CPU core unless set here (1 to 64). Other platforms use one.
# udp_sockets = 4

# Started as root (Linux, without systemd), goethite switches to this user
# right after binding its sockets, and keeps no capabilities. Under the systemd
# unit in deploy/systemd it already runs unprivileged; leave this unset there.
# user = "goethite"

# TCP connections served at once, in total and from one client (an IPv4
# address or an IPv6 /64). These are the defaults.
max_tcp_connections = 256
max_tcp_connections_per_client = 16

# Queries per second per client network, over UDP, TCP, DNS over TLS, HTTPS
# and QUIC together. Over UDP, a client over the limit has its queries
# dropped, except every slip-th one, which gets an empty truncated answer so a
# real client retries over TCP; this stops goethite from being used to flood a
# spoofed address with answers. Over the other transports it gets REFUSED.
# Loopback clients are never limited, nor are networks listed in exempt.
# These are the defaults; set queries_per_second = 0 to turn rate limiting
# off. Which clients may use goethite at all is a replicated setting (the web
# UI's Settings, or `access` in /api/v1/settings), not part of this file.
[server.rate_limit]
queries_per_second = 300
burst = 1000
slip = 2
ipv4_prefix = 32       # clients in the same /32 share a limit (each address)
ipv6_prefix = 64       # clients in the same /64 share a limit
max_clients = 65536    # client networks tracked at once
exempt = []            # never limited, such as ["192.168.0.0/16"]; at most 256

# DNS over TLS, HTTPS and QUIC for clients, with a certificate for the name
# devices use (and *.<that name>, for client IDs in the server name). Read at
# startup and again on SIGHUP. Encrypted connections count against the TCP
# connection limits above. See the site's "Encrypted DNS" page.
# [server.tls]
# cert = "/etc/goethite/tls/fullchain.pem"
# key = "/etc/goethite/tls/privkey.pem"
# server_name = "dns.example"   # anna-phone.dns.example carries a client ID
# dot = ["0.0.0.0:853", "[::]:853"]
# doh = ["0.0.0.0:443", "[::]:443"]   # https://dns.example/dns-query
# doq = ["0.0.0.0:853", "[::]:853"]   # UDP; quic://dns.example
# Reachable from the internet? Answer encrypted queries only with a known
# client ID, so goethite is no open resolver.
# require_client_id = true
# Also an Oblivious DoH target (RFC 9230) on the doh addresses, for clients
# that ask through a proxy: https://dns.example/.well-known/odohconfigs
# odoh = true

# Upstream resolvers, tried in this order with failover. At least one is
# required: goethite does not pick a resolver on your behalf.
#
#   address         IP address, optionally with a port (default: 53 for udp
#                   and tcp, 853 for tls, 443 for https). Not a hostname.
#   protocol        "udp" (retried over TCP when the answer is truncated, the
#                   default), "tcp", "tls" (DNS over TLS) or "https" (DNS over
#                   HTTPS, HTTP/2)
#   tls_name        for "tls": the name the server's certificate must be
#                   valid for
#   url             for "https": the query URL; its host is the name the
#                   certificate must be valid for
#   randomize_case  0x20 case randomization of query names, a defense against
#                   spoofed answers (default true). Turn it off only for an
#                   upstream that does not preserve the case of names.
#
# Certificates are checked against the Mozilla root certificates bundled into
# goethite, not the operating system's store.
#
# Quad9 (non-profit, does not log client IP addresses) over DNS over TLS:
[[upstream]]
address = "9.9.9.9"
protocol = "tls"
tls_name = "dns.quad9.net"

[[upstream]]
address = "149.112.112.112"
protocol = "tls"
tls_name = "dns.quad9.net"

# The same service over DNS over HTTPS:
#
# [[upstream]]
# address = "9.9.9.9"
# protocol = "https"
# url = "https://dns.quad9.net/dns-query"
#
# Plain DNS (unencrypted; visible to and changeable by anyone on the path):
#
# [[upstream]]
# address = "9.9.9.9"

# Or ask no upstream at all: resolve every name from the root servers down,
# as Unbound does. Remove the [[upstream]] tables above to use it. Each
# server sees only as much of a name as it needs (QNAME minimisation);
# servers are asked over IPv6 too when this host has an IPv6 route. Answers
# are validated with DNSSEC: signed ones get the AD flag, and ones whose
# signatures fail are refused with SERVFAIL.
#
# [recursion]
# enabled = true
# qname_minimisation = true
# ipv6 = true
# dnssec = true

[cache]
# Answers from the upstreams are cached until their TTL runs out. These are
# the defaults.
max_entries = 10000       # 0 turns the cache off; at most 1,000,000
min_ttl = 0               # keep positive answers at least this long (seconds)
max_ttl = 86400           # ... and at most this long (at most one week)
max_negative_ttl = 3600   # NXDOMAIN and NODATA at most this long (at most one day)

[filter]
# Filtering lives in goethite's store (see [store] below), where the API can
# change it. This table only seeds the store on the first start: after that
# the store is the source of truth, and edits here are reported but not
# applied until you stop goethite and run `goethite import --config <file>`.
#
# Blocking. Rules come from list files and from `rules` below; hosts files,
# plain domain lists and the core AdGuard syntax are all understood, mixed
# freely:
#
#   0.0.0.0 ads.example     block exactly ads.example (hosts format)
#   ads.example             block exactly ads.example (domain list)
#   *.ads.example           block every name below ads.example
#   ||ads.example^          block ads.example and every name below it
#   |ads.example^           block exactly ads.example
#   @@||good.example^       exception: never block good.example or below
#
# Lines goethite does not support yet (regular expressions, $modifiers) are
# counted and skipped. Send SIGHUP to re-read the list files.
enabled = true
block_response = "null_ip"   # "null_ip" (0.0.0.0 / ::), "nxdomain" or "refused"
blocked_ttl = 10             # TTL of the null-IP answers, in seconds
rules = [
  "||doubleclick.net^",
]

# Downloaded lists are kept here (relative paths are relative to this file),
# so goethite starts with them even when offline. Defaults to "lists" in the
# state directory (see [store]).
cache_dir = "lists"
update_hours = 24            # how often url lists are refreshed (1 to 168)

# A new node with no [[filter.list]] below starts with goethite's default
# list, HaGeZi Multi Normal, in the default group. Set this to false to start
# with none. Only the first start of a new store looks at it.
default_lists = true

# The web UI can search the FilterLists directory (filterlists.com) for more
# lists: this node fetches it, only when someone browses it. false turns it
# off.
directory = true

# Groups can block whole services (TikTok, YouTube, Roblox…): this node
# downloads AdGuard's services catalog (GPL-3.0) with the lists. false turns
# it off; services_file reads the catalog from a file instead, for nodes
# without internet access.
services = true
# services_file = "/etc/goethite/services.json"

# What to do when filtering fails (a broken store or filter): "open" keeps
# resolving, unfiltered if need be, and reports it; "closed" refuses to
# start or answers SERVFAIL.
on_failure = "open"

# Lists from local files are read from this directory only. This is the
# default: lists beside this file.
# local_lists_dir = "lists"
#
# A list from a local file, in local_lists_dir:
#
# [[filter.list]]
# path = "lists/hosts.txt"
#
# A list downloaded over HTTPS, refreshed every update_hours:
#
# [[filter.list]]
# url = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"

[security]
# DNS rebinding protection: answers for public names may not point into the
# local network (RFC 1918, loopback, link-local, carrier NAT, unique-local
# IPv6). Names below private_domains are exempt, as is anything answered by
# goethite itself. These are the defaults.
rebinding_protection = true
private_domains = ["lan", "home.arpa", "internal", "local"]
# On Linux goethite confines itself once running: Landlock limits the files
# it can reach, seccomp the system calls it can make. Turn it off only to
# diagnose a problem you suspect it causes.
sandbox = true

[store]
# goethite's database: the filtering configuration (lists, rules, groups,
# clients, schedules) and the audit log of every change. It defaults to
# goethite.redb in the state directory: systemd's StateDirectory
# (/var/lib/goethite with the unit in deploy/systemd), otherwise the directory
# of this file. Only one goethite process can use it at a time.
# path = "/var/lib/goethite/goethite.redb"

[querylog]
# Every answered query is logged with the client's address, the name, how it
# was answered and the rule that blocked it, if one did. Statistics (counts
# per hour and the names and clients asked most) are kept for 30 days whether
# or not the log is on. These are the defaults.
enabled = true
retention_days = 7          # 1 to 365
max_entries = 1000000       # the oldest go first; 1,000 to 50,000,000
anonymize_clients = false   # true keeps only the /24 (IPv4) or /56 (IPv6)

[api]
# The REST API (/api/v1), its metrics (/metrics) and the web UI (/).
# Without an admin token it answers loopback only, and refuses to start on
# any other address. To reach it from the network, run `goethite token`, put
# the printed hash here, and preferably serve HTTPS with your own
# certificate. These are the defaults.
enabled = true
listen = "127.0.0.1:8053"
# token_sha256 = "<64 hex digits from `goethite token`>"
# tls_cert = "/etc/goethite/api.crt"
# tls_key = "/etc/goethite/api.key"
web_ui = true
# The API reference at /api/docs, for loopback clients only.
docs = false

# [telemetry]
# Sends the metrics to an OpenTelemetry collector over OTLP/HTTP as well as
# serving them at /metrics. Nothing is sent without an endpoint. goethite
# resolves the collector's name through its own upstreams and local records,
# not /etc/resolv.conf: give an address, or a name those answer. The header
# and CA files are read before goethite drops its privileges.
# endpoint = "https://collector.example:4318"  # /v1/metrics is appended
# headers_file = "/etc/goethite/otlp-headers"   # "Name: value" lines, e.g. an API key
# ca_file = "/etc/goethite/otlp-ca.pem"         # a private CA instead of the public roots
# metrics = true
# interval = 60                                 # seconds between exports, 10 to 3600

# [cluster]
# goethite nodes sharing one configuration: they agree on every change with
# Raft, over mutual TLS. Two nodes and a witness (`goethite witness`, which
# only votes) keep working when any one of them is lost. Create the
# certificates with `goethite cluster init` and `goethite cluster cert <node>`.
# node = "dns1"
# bootstrap = true            # on one node only: start the cluster here
# listen = "192.0.2.11:8054"  # also the address the others reach it on
# ca = "/etc/goethite/cluster/ca.crt"
# cert = "/etc/goethite/cluster/dns1.crt"
# key = "/etc/goethite/cluster/dns1.key"
#
# The other members, one table each.
# [[cluster.member]]
# node = "dns2"
# address = "192.0.2.12:8054"
#
# [[cluster.member]]
# node = "witness"
# address = "192.0.2.13:8054"

# [vrrp]
# A floating IP: clients use this one address for DNS, and whichever node
# is healthy holds it. Run `goethite vrrp` (goethite-vrrp.service) on both
# nodes, and add the address to [server] listen on both, beside an address
# that is always there for the health check, such as
# listen = ["192.0.2.53:53", "127.0.0.1:53"].
# interface = "eth0"
# address = "192.0.2.53"
# peer = "192.0.2.12"         # the other node's own address on the interface
# router_id = 53              # 1-255: the same on both nodes, unique on the network
# priority = 150              # 1-254: the healthy node with the higher one holds it
# interval_ms = 1000          # how often the holder says so; failover takes ~3.5x
# preempt = true              # take the address back when healthy again
# unicast = false             # advertise to the peer, for networks without multicast
# check = "127.0.0.1:53"      # where to check goethite; defaults from [server] listen
