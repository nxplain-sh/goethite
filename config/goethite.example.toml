# goethite configuration (example)
#
# Run with:  goethite run --config config/goethite.example.toml
#
# This file only bootstraps a node. Unknown keys are rejected, so a typo is an
# error rather than a silently ignored setting.

[server]
# Address for DNS over UDP and TCP. Port 15353 on loopback lets development
# builds run without root (5353 is avoided: it is multicast DNS and usually
# taken). Production uses port 53, e.g. "0.0.0.0:53" or "[::]:53". Use an IP
# address here, not a hostname. This is the default.
listen = "127.0.0.1:15353"

# Upstream resolvers, tried in this order with failover. At least one is
# required: goethite does not pick a resolver on your behalf.
#
#   address         IP address, optionally with a port (default: 53 for udp
#                   and tcp, 853 for tls, 443 for https). Not a hostname.
#   protocol        "udp" (retried over TCP when the answer is truncated, the
#                   default), "tcp", "tls" (DNS over TLS) or "https" (DNS over
#                   HTTPS, HTTP/2)
#   tls_name        for "tls": the name the server's certificate must be
#                   valid for
#   url             for "https": the query URL; its host is the name the
#                   certificate must be valid for
#   randomize_case  0x20 case randomization of query names, a defense against
#                   spoofed answers (default true). Turn it off only for an
#                   upstream that does not preserve the case of names.
#
# Certificates are checked against the Mozilla root certificates bundled into
# goethite, not the operating system's store.
#
# Quad9 (non-profit, does not log client IP addresses) over DNS over TLS:
[[upstream]]
address = "9.9.9.9"
protocol = "tls"
tls_name = "dns.quad9.net"

[[upstream]]
address = "149.112.112.112"
protocol = "tls"
tls_name = "dns.quad9.net"

# The same service over DNS over HTTPS:
#
# [[upstream]]
# address = "9.9.9.9"
# protocol = "https"
# url = "https://dns.quad9.net/dns-query"
#
# Plain DNS (unencrypted; visible to and changeable by anyone on the path):
#
# [[upstream]]
# address = "9.9.9.9"

[cache]
# Answers from the upstreams are cached until their TTL runs out. These are
# the defaults.
max_entries = 10000       # 0 turns the cache off; at most 1,000,000
min_ttl = 0               # keep positive answers at least this long (seconds)
max_ttl = 86400           # ... and at most this long (at most one week)
max_negative_ttl = 3600   # NXDOMAIN and NODATA at most this long (at most one day)
