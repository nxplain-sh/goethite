# The panic-family lints are denied in [workspace.lints]; tests may use them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true

# Acronyms and names that `clippy::doc_markdown` would otherwise want in backticks.
doc-valid-idents = ["DoH", "DoT", "DoQ", "ODoH", "DNSSEC", "EDNS", "OpenAPI", "TanStack", "AdGuard", "FilterLists", "HaGeZi", "TikTok", "YouTube", "HostlistsRegistry", "RRset", "RRsets", "KeyTrap", "CycloneDX", "SELinux", ".."]
