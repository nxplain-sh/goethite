# DNS on port 53, UDP and TCP. With a LoadBalancer, externalTrafficPolicy is
# Local, so goethite sees client addresses and not the load balancer's.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "goethite.fullname" . }}
  labels:
    {{- include "goethite.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
  selector:
    {{- include "goethite.selectorLabels" . | nindent 4 }}
