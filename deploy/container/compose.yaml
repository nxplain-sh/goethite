# goethite with Docker Compose or Podman Compose: DNS on port 53, the store
# and downloaded lists in a volume, and the image's own config (Quad9 over DNS
# over TLS, the recommended filter lists) until you mount yours.
#
#   docker compose up -d        # or podman compose, in this directory
#   docker compose logs -f
#
# goethite runs as the image's unprivileged user (65532) from the start, with
# no capabilities, no way to gain any and a read-only root file system. That
# is tighter than the image on its own, which starts as root to bind port 53
# on any runtime. `docker compose pull && docker compose up -d`
# brings a patch release; change the tag first for the next minor version.
# The restart drops queries for a second or two.
#
# The install guide explains the rest:
# https://nxplain-sh.github.io/goethite/install/#in-a-container

name: goethite

services:
  goethite:
    # The newest release of this minor version. `cargo xtask versions`
    # checks that it is the repository's.
    image: ghcr.io/nxplain-sh/goethite:0.6
    restart: unless-stopped
    ports:
      # Where systemd-resolved holds 127.0.0.53:53, or to answer on one
      # address only, put the host's address first: "192.0.2.10:53:53/udp".
      - "53:53/udp"
      - "53:53/tcp"
      # The API and the web UI, once your config sets [api] listen =
      # "0.0.0.0:8053" and the hash of an admin token, which `docker compose
      # run --rm goethite token` makes. Loopback only: put HTTPS in front
      # before publishing it further.
      # - "127.0.0.1:8053:8053/tcp"
    volumes:
      # The store and the downloaded lists. A bind mount instead of this
      # volume must belong to 65532:65532.
      - data:/var/lib/goethite
      # Your own config: copy the image's out with `docker compose cp
      # goethite:/etc/goethite/goethite.toml .`, change it, and uncomment this
      # line. A directory of local lists goes in /etc/goethite/lists the same
      # way.
      # - ./goethite.toml:/etc/goethite/goethite.toml:ro,z
    user: "65532:65532"
    # Lets that user bind port 53, in the container's network namespace only.
    # Docker allows it by default, Podman does not.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 53
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # goethite writes only to /var/lib/goethite.
    read_only: true
    # Every UDP query in flight forwards over its own socket; the systemd unit
    # allows as many.
    ulimits:
      nofile: 65536
    # goethite tells clients apart by their address: for groups, the query log
    # and the rate limit (300 queries a second per client by default). Where
    # the query log shows one address for every client, as behind Docker
    # Desktop or some rootless runtimes, use the host's network instead:
    # replace ports, user and sysctls with
    #   network_mode: host
    #   cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    # and goethite starts as root, binds port 53 and drops to 65532 itself.

volumes:
  data:
